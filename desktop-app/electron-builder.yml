appId: com.skymovie.desktop
productName: Sky Movie
copyright: Copyright 2026 Sky Movie
executableName: sky-movie
electronVersion: 37.10.3

directories:
  output: dist
  buildResources: build

files:
  - electron/**
  - package.json
  - build/**
  - '!node_modules/**'
  - '!**/node_modules/**'

extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - '**/*'

asar: true
asarUnpack:
  - '**/*.node'

npmRebuild: false
buildDependenciesFromSource: false

win:
  icon: build/favicon.ico
  # Arch is intentionally not pinned here: CI passes --x64/--arm64 per job,
  # and pinning arch in config makes electron-builder ignore those CLI flags.
  target:
    - nsis
    - dir
  artifactName: 'Sky-Movie-${version}-${arch}-Setup.${ext}'
  extraResources:
    - from: resources/mpv
      to: mpv
      filter:
        - '**/*'
    - from: resources/bin
      to: bin
      filter:
        - '**/*'

mac:
  icon: build/favicon.png
  category: public.app-category.video
  target:
    - dmg
    - zip
  artifactName: 'Sky-Movie-${version}-${arch}.${ext}'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: resources/mpv
      to: mpv
      filter:
        - '*.node'
        - '!*.dll'
        - '!*.lib'
    - from: resources/bin
      to: bin
      filter:
        - '!*.exe'

dmg:
  artifactName: 'Sky-Movie-${version}-${arch}.${ext}'
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  format: UDZO
  window:
    width: 540
    height: 380

linux:
  icon: build/favicon.png
  category: AudioVideo
  maintainer: Sky Movie
  syncDesktopName: true
  target:
    - AppImage
    - deb
    - tar.gz
  artifactName: 'Sky-Movie-${version}-${arch}.${ext}'
  extraResources:
    - from: resources/mpv
      to: mpv
      filter:
        - '*.node'
        - '!*.dll'
        - '!*.lib'
    - from: resources/bin
      to: bin
      filter:
        - '!*.exe'

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  priority: optional

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sky Movie
