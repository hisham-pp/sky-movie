name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Runtime to build'
        required: true
        default: windows-x64
        type: choice
        options:
          - windows-x64
          - windows-arm64
          - macos-x64
          - macos-arm64
          - linux-x64
          - linux-arm64
          - all
  push:
    tags:
      - 'desktop-v*'

jobs:
  select-builds:
    name: Select build targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          target="${{ github.event.inputs.build_target || 'windows-x64' }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            target="windows-x64"
          fi

          windows_x64='{"os":"windows-latest","platform":"windows","arch":"x64","packageCommand":"pnpm --filter @sky-movie/desktop-app run package:win:builder:ci --x64"}'
          windows_arm64='{"os":"windows-latest","platform":"windows","arch":"arm64","packageCommand":"pnpm --filter @sky-movie/desktop-app run package:win:builder:ci --arm64"}'
          macos_x64='{"os":"macos-latest","platform":"macos","arch":"x64","packageCommand":"pnpm --filter @sky-movie/desktop-app run package:mac:ci --x64"}'
          macos_arm64='{"os":"macos-latest","platform":"macos","arch":"arm64","packageCommand":"pnpm --filter @sky-movie/desktop-app run package:mac:ci --arm64"}'
          linux_x64='{"os":"ubuntu-latest","platform":"linux","arch":"x64","packageCommand":"pnpm --filter @sky-movie/desktop-app run package:linux:ci --x64"}'
          linux_arm64='{"os":"ubuntu-latest","platform":"linux","arch":"arm64","packageCommand":"pnpm --filter @sky-movie/desktop-app run package:linux:ci --arm64"}'

          case "$target" in
            windows-x64) matrix="{\"include\":[$windows_x64]}" ;;
            windows-arm64) matrix="{\"include\":[$windows_arm64]}" ;;
            macos-x64) matrix="{\"include\":[$macos_x64]}" ;;
            macos-arm64) matrix="{\"include\":[$macos_arm64]}" ;;
            linux-x64) matrix="{\"include\":[$linux_x64]}" ;;
            linux-arm64) matrix="{\"include\":[$linux_arm64]}" ;;
            all) matrix="{\"include\":[$windows_x64,$windows_arm64,$macos_x64,$macos_arm64,$linux_x64,$linux_arm64]}" ;;
            *) echo "Unknown build target: $target" >&2; exit 1 ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: select-builds
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-builds.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ── Platform deps ────────────────────────────────────────────────────────
      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.arch }}-libmpv-${{ hashFiles('.github/workflows/build-desktop.yml') }}
          restore-keys: apt-${{ runner.arch }}-libmpv-

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # dpkg-sig removed: not available in Ubuntu 24.04 (DEB signing step is disabled)
          sudo apt-get install -y --no-install-recommends libarchive-tools libmpv-dev

      - name: Cache Homebrew Cellar
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/mpv
            /opt/homebrew/Cellar/ffmpeg
            /opt/homebrew/Cellar/libass
            /opt/homebrew/Cellar/libplacebo
          key: brew-mpv-${{ runner.arch }}-${{ hashFiles('.github/workflows/build-desktop.yml') }}
          restore-keys: brew-mpv-${{ runner.arch }}-

      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: brew install mpv || true

      - name: Check VS C++ workload (Windows)
        if: runner.os == 'Windows'
        id: vs-check
        shell: powershell
        run: |
          $vsWhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $has = & $vsWhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          echo "has_vc=$( if ($has) { 'true' } else { 'false' } )" >> $env:GITHUB_OUTPUT

      - name: Add VS C++ workload (Windows)
        if: runner.os == 'Windows' && steps.vs-check.outputs.has_vc == 'false'
        shell: powershell
        run: |
          $vsWhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsInstallPath = & $vsWhere -latest -property installationPath
          Start-Process $installer -ArgumentList "modify --installPath `"$vsInstallPath`" --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --quiet --norestart" -Wait
      # ────────────────────────────────────────────────────────────────────────

      - name: Install dependencies
        run: pnpm install

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-cache-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-cache-${{ runner.os }}-${{ matrix.arch }}-

      - name: Cache libmpv artifacts
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            desktop-app/resources/mpv
            desktop-app/native/mpv-player/lib
            desktop-app/native/mpv-player/include
          key: libmpv-${{ runner.arch }}-${{ hashFiles('scripts/download-libmpv.mjs') }}

      - name: Prepare libmpv
        run: pnpm --filter @sky-movie/desktop-app run prepare:libmpv

      - name: Build mpv native addon
        run: pnpm --filter @sky-movie/desktop-app run build:native

      - name: Build app bundles
        run: pnpm --filter @sky-movie/desktop-app run build:ci
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Package app
        run: ${{ matrix.packageCommand }}
        env:
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # - name: Sign DEB packages
      #   if: runner.os == 'Linux' && secrets.GPG_PRIVATE_KEY != ''
      #   run: |
      #     # Import GPG private key
      #     echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --passphrase "${{ secrets.GPG_PASSPHRASE }}"
          
      #     # Get the key ID
      #     KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep -A 1 "sec" | tail -1 | awk '{print $1}')
          
      #     # Sign all .deb packages
      #     for deb in desktop-app/dist/*.deb; do
      #       if [ -f "$deb" ]; then
      #         dpkg-sig -k "$KEY_ID" --sign builder "$deb"
      #         echo "Signed: $deb"
      #       fi
      #     done
      #   env:
      #     GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sky-movie-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-app/dist/**
